name: BRINC
description: >-
  BRINC builds a connected ecosystem of drones, software, and services purpose-built for public
  safety in the United States. Its Drone as First Responder (DFR) systems — the Guardian and
  Responder outdoor drones, the Lemur 2 indoor tactical drone, and the throwable BRINC Ball — pair
  with LiveOps teleoperations software (livestreaming, two-way comms, evidence management) to put a
  camera overhead within seconds of a 911 call. BRINC reports deployments across 900+ public safety
  agencies in all 50 states, sub-70-second average drone arrival times, and a recent $125M funding
  round. The company also runs its Safeguard upgrade-and-repair program and grant/DFR playbook
  services. BRINC exposes no public developer API, SDK, or MCP surface as of this profile; this entry
  is enriched from the company's public web presence.
